<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineApp - Taller 2</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (opcional, para los iconos del navbar) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <!-- ===================== NAVBAR ===================== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="https://cdn.jsdelivr.net/gh/twbs/icons@1.11.3/icons/film.svg"
             alt="Logo CineApp" width="28" height="28" class="navbar-logo">
        <span>CineApp</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#" data-view="movies-view">
              <i class="bi bi-camera-reels"></i> Películas
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-view="news-view">
              <i class="bi bi-newspaper"></i> Noticias
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-view="charts-view">
              <i class="bi bi-bar-chart-line"></i> Gráficas
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===================== MOVIES VIEW ===================== -->
  <main class="container-fluid py-4" id="movies-view">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h1 class="h3 mb-0">Catálogo de películas</h1>
      <input type="search" id="movieSearch" class="form-control" style="max-width: 280px"
             placeholder="Buscar por título o género...">
    </div>
    <div id="movieCount" class="text-secondary small mb-3"></div>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4" id="moviesContainer">
      <!-- Las tarjetas de películas se insertan aquí vía JavaScript -->
    </div>
  </main>

  <!-- ===================== NEWS VIEW ===================== -->
  <main class="container py-4 d-none" id="news-view">
    <h1 class="h3 mb-4">Noticias del cine</h1>
    <div id="newsContainer" class="d-flex flex-column gap-3">
      <!-- Las tarjetas horizontales de noticias se insertan aquí vía JavaScript -->
    </div>
  </main>

  <!-- ===================== CHARTS VIEW ===================== -->
  <main class="container py-4 d-none" id="charts-view">
    <h1 class="h3 mb-4">Estadísticas del catálogo</h1>
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-header fw-semibold">Películas por año</div>
          <div class="card-body">
            <canvas id="chartByYear" height="260"></canvas>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-header fw-semibold">Películas por género</div>
          <div class="card-body">
            <canvas id="chartByGenre" height="260"></canvas>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-secondary small py-4">
    Taller 2 &middot; Programación Interfaces 1 &middot; Dataset: movies_initial.csv
  </footer>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <script src="assets/news.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
